name: continuous-integration

# Intentional cost control: only an explicit author click can start this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned lightweight validation stack
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Check metadata, source hashes and retained-evidence boundaries
        run: python -B scripts/check_current_release.py
      - name: Run the 37 source tests
        run: python -B -m unittest discover -s tests -v
